name: tarea7_intromovil
description: "Caja de herramientas: ocho vistas y consultas a API públicas."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  html: ^0.15.6
  intl: ^0.20.3
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/profile.png
  adaptive_icon_background: '#EAF3EF'
  adaptive_icon_foreground: assets/icon/profile.png
